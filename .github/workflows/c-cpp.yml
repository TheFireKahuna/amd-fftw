name: C/C++ CI

on:
  push:
    branches: [ "amd-fftw" ]
  pull_request:
    branches: [ "amd-fftw" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: ./configure --enable-sse2 --enable-avx --enable-avx2 --enable-openmp --enable-shared --enable-amd-opt --enable-dynamic-dispatcher
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
