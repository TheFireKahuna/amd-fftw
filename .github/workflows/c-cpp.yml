name: C/C++ CI

on:
  push:
    branches: [ "amd-fftw" ]
  pull_request:
    branches: [ "amd-fftw" ]

jobs:
  build:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # -B build: Create a build directory named 'build'
      # -A x64: Explicitly target 64-bit architecture
      # We map your original autotools flags to the CMake options defined in your CMakeLists.txt
      run: >
        cmake -S . -B build -A x64
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=ON
        -DENABLE_SHARED=ON
        -DENABLE_SSE2=ON
        -DENABLE_AVX=ON
        -DENABLE_AVX2=ON
        -DENABLE_AMD_OPT=ON

    - name: Build
      # Build the Release configuration
      run: cmake --build build --config Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fftw-windows-release-x64
        path: |
          build/Release/*.dll
          build/Release/*.lib
          build/include/*
